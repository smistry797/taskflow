<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-3 -2 36 26'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%231E293B'/><stop offset='100%25' stop-color='%2364748B'/></linearGradient></defs><path d='M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z' fill='none' stroke='url(%23g)' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

/*
  FIRESTORE SECURITY RULES — paste into Firebase Console > Firestore > Rules:
  -----------------------------------------------------------------------
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /tasks/{taskId} {
        allow read, write: if request.auth != null;
      }
    }
  }
  -----------------------------------------------------------------------
*/

var cfg = {
  apiKey: "AIzaSyD8R-lhnnaebAfk7NT84Jvv706UvKBILvE",
  authDomain: "taskflow-af878.firebaseapp.com",
  projectId: "taskflow-af878",
  storageBucket: "taskflow-af878.firebasestorage.app",
  messagingSenderId: "287459262722",
  appId: "1:287459262722:web:184b71f4e705a607c2821b"
};

var app = initializeApp(cfg);
var db = getFirestore(app);
var auth = getAuth(app);
var provider = new GoogleAuthProvider();
var COL = 'tasks';

window._fb = {
  load: async function() {
    var s = await getDocs(query(collection(db, COL), orderBy('createdAt', 'desc')));
    return s.docs.map(function(d) { return Object.assign({id: d.id}, d.data(), {updated: d.data().updatedAt && d.data().updatedAt.toMillis ? d.data().updatedAt.toMillis() : Date.now()}); });
  },
  add: async function(f) {
    return (await addDoc(collection(db, COL), Object.assign({}, f, {createdAt: serverTimestamp(), updatedAt: serverTimestamp()}))).id;
  },
  update: async function(id, f) {
    await updateDoc(doc(db, COL, id), Object.assign({}, f, {updatedAt: serverTimestamp()}));
  },
  remove: async function(id) {
    await deleteDoc(doc(db, COL, id));
  },
  signIn: async function() {
    await signInWithPopup(auth, provider);
  },
  signOut: async function() {
    await signOut(auth);
  }
};

onAuthStateChanged(auth, function(user) {
  // Dismiss loading overlay
  var al = document.getElementById('auth-loading');
  if (al) { al.style.opacity = '0'; setTimeout(function(){ al.style.display='none'; }, 200); }
  window._authUser = user;
  if (user) {
    var ls = document.getElementById('login-screen');
    var ap = document.getElementById('app-root');
    if (ls) ls.style.display = 'none';
    if (ap) ap.style.display = 'flex';
    var pill = document.getElementById('user-pill');
    if (pill) {
      var initials = (user.displayName || user.email || '?').split(' ').map(function(p){return p[0];}).join('').slice(0,2).toUpperCase();
      pill.innerHTML =
        (user.photoURL
          ? '<img src="'+user.photoURL+'" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0" referrerpolicy="no-referrer">'
          : '<div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#1E293B,#64748B);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">'+initials+'</div>') +
        '<span style="font-size:12px;font-weight:500;color:#334155;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(user.displayName || user.email)+'</span>';
    }
    if (typeof window._appLoad === 'function') { window._appLoad(); window._appLoad = null; }
  } else {
    // Only show login after Firebase has confirmed no session
    var ls2 = document.getElementById('login-screen');
    var ap2 = document.getElementById('app-root');
    if (ls2) ls2.style.display = 'flex';
    if (ap2) ap2.style.display = 'none';
  }
});
</script>

.tl-time{font-size:10px;color:#94a3b8;margin-top:1px}
.empty{text-align:center;color:#94a3b8;font-size:11px;padding:14px 0}

/* Auth */
#login-screen{position:fixed;inset:0;background:#f0ede8;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0}
.login-card{background:#fff;border-radius:20px;padding:40px 44px;width:360px;max-width:92vw;box-shadow:0 24px 64px rgba(30,41,59,.13);display:flex;flex-direction:column;align-items:center;gap:0}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.login-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.login-sub{font-size:13px;color:#94a3b8;margin-bottom:32px;text-align:center}
.google-btn{display:flex;align-items:center;gap:10px;padding:0 22px;height:44px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;font-size:13px;font-weight:600;color:#1E293B;cursor:pointer;font-family:inherit;width:100%;justify-content:center;transition:all .15s;box-shadow:0 2px 8px rgba(30,41,59,.06)}
.google-btn:hover{background:#f8fafc;border-color:#94a3b8;box-shadow:0 4px 16px rgba(30,41,59,.1)}
.google-btn:active{transform:scale(.98)}
.login-footer{font-size:11px;color:#cbd5e1;margin-top:20px}
#user-pill{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;border:1px solid #e2e8f0;border-radius:99px;background:#f8fafc;cursor:default;max-width:200px}
.signout-btn{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:11px;font-weight:600;font-family:inherit;padding:3px 8px;border-radius:6px;transition:all .15s}
.signout-btn:hover{color:#dc2626;background:#fef2f2}
</style>
</head>
<body>

<!-- Auth loading overlay -->
<div id="auth-loading" style="position:fixed;inset:0;background:#f0ede8;display:flex;align-items:center;justify-content:center;z-index:99999">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <svg width="52" height="32" viewBox="-2 0 32 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="alg" x1="0" y1="0" x2="28" y2="22" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="100%" stop-color="#64748B"/>
        </linearGradient>
      </defs>
      <path id="inf-path" d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z"
        fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z"
        fill="none" stroke="url(#alg)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="30 90" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </svg>
    <span style="font-size:12px;font-weight:500;color:#94a3b8;letter-spacing:.02em">Loading...</span>
  </div>
</div>
<style>#auth-loading{transition:opacity .25s}</style>

<!-- Login Screen -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <svg width="34" height="20" viewBox="-2 0 32 22" fill="none">
        <defs><linearGradient id="llg" x1="0" y1="0" x2="28" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#64748B"/></linearGradient></defs>
        <path d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z" fill="none" stroke="url(#llg)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="login-title"><span style="color:#1E293B">Task</span><span style="background:linear-gradient(90deg,#1E293B,#64748B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Flow</span></div>
    </div>
    <div class="login-sub">Sign in to access your tasks</div>
    <button class="google-btn" onclick="window._fb && window._fb.signIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>
    <div class="login-footer">Your tasks are private and secured</div>
  </div>
</div>

<div id="app-root" class="app" style="display:none">
  <div class="nav">
    <div class="nav-left">
      <div class="nav-brand">
        <svg width="34" height="20" viewBox="-2 0 32 22" fill="none">
          <defs><linearGradient id="nlg" x1="0" y1="0" x2="28" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#64748B"/></linearGradient></defs>
          <path d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z" fill="none" stroke="url(#nlg)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="nav-brand-word">
          <span style="color:#1E293B">Task</span><span style="background:linear-gradient(90deg,#1E293B,#64748B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Flow</span>
        </div>
      </div>
      <div class="nav-tab active" id="tab-tracker" onclick="switchTab('tracker')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>Task Tracker
      </div>
      <div class="nav-tab" id="tab-dashboard" onclick="switchTab('dashboard')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="8" height="11" rx="1"/><rect x="14" y="10" width="7" height="5" rx="1"/></svg>Dashboard
      </div>
      <div class="nav-tab" id="tab-archived" onclick="switchTab('archived')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5" rx="1"/><line x1="10" y1="12" x2="14" y2="12"/></svg>Archived
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="sync-status"></span>
      <div id="user-pill"></div>
      <button class="signout-btn" onclick="window._fb && window._fb.signOut()" title="Sign out">Sign out</button>
      <button class="btn primary" id="nav-new-btn" onclick="openModal()">+ New task</button>
    </div>
  </div>

  <div class="page active" id="page-tracker">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></span>
        <input type="text" id="search" placeholder="Search tasks..." oninput="renderTracker()">
      </div>
      <div id="dd-status"></div>
      <div id="dd-priority"></div>
      <div id="dd-assignee"></div>
      <div class="view-toggle">
        <button id="btn-kanban" class="active" onclick="setView('kanban')" title="Kanban">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
        </button>
        <button id="btn-list" onclick="setView('list')" title="List">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="main-view" style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;padding:12px 18px 16px"></div>
  </div>

  <div class="page" id="page-dashboard">
    <div class="dash-body"><div class="dash-grid" id="dash-grid"></div></div>
  </div>

  <div class="page" id="page-archived">
    <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;padding:12px 18px 16px">
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px;display:flex;align-items:center;gap:6px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5" rx="1"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        Tasks marked Done more than 7 days ago
      </div>
      <div id="archived-view" style="flex:1;overflow:auto"></div>
    </div>
  </div>
</div>
<div id="modal-container"></div>
</div><!-- /app-root -->

<script>
var STATUSES = [
  {id:'todo', label:'To Do', color:'#94a3b8', tcls:'s-todo', hdr:'#e2e8f0', dot:'#94a3b8'},
  {id:'inprogress', label:'In Progress', color:'#2563eb', tcls:'s-inprogress', hdr:'#dbeafe', dot:'#2563eb'},
  {id:'waiting', label:'Waiting', color:'#d97706', tcls:'s-waiting', hdr:'#fef3c7', dot:'#d97706'},
  {id:'done', label:'Done', color:'#16a34a', tcls:'s-done', hdr:'#dcfce7', dot:'#16a34a'},
  {id:'blocked', label:'Blocked', color:'#dc2626', tcls:'s-blocked', hdr:'#fee2e2', dot:'#dc2626'}
];
var PRIORITIES = [{id:'Critical',dot:'#dc2626'},{id:'High',dot:'#d97706'},{id:'Medium',dot:'#2563eb'},{id:'Low',dot:'#16a34a'}];
var PSTYLE = {
  'Critical': {bg:'#fee2e2', color:'#991b1b'},
  'High':     {bg:'#fef3c7', color:'#92400e'},
  'Medium':   {bg:'#dbeafe', color:'#1e40af'},
  'Low':      {bg:'#dcfce7', color:'#166534'}
};
var PCOLORS = {'Critical':'#dc2626','High':'#d97706','Medium':'#2563eb','Low':'#16a34a'};
var PORDER = ['Critical','High','Medium','Low'];
var TAG_COLORS = ['tc4','tc5','tc6','tc7','tc8','tc9','tc10','tc11'];
var ALL_TAGS = ['DevOps','QA','Bug','Docs','Client','HR','Autoweave','SLA'];
var AVATAR_PALETTE = [
  ['#dbeafe','#1e40af'],['#dcfce7','#166534'],['#fef3c7','#92400e'],
  ['#f3e8ff','#6b21a8'],['#fce7f3','#9d174d'],['#e0f2fe','#0c4a6e'],
  ['#ffedd5','#9a3412'],['#f0fdf4','#14532d']
];

var tagColorMap = {};
var tasks = [];
var view = 'kanban';
var editId = null;
var currentTab = 'tracker';
var filters = {status:'', priority:'', assignee:''};
var openDDClose = null;

function getTagColor(t) {
  if (!tagColorMap[t]) {
    var used = Object.values(tagColorMap);
    tagColorMap[t] = TAG_COLORS.filter(function(c){return used.indexOf(c)===-1;})[0] || TAG_COLORS[Object.keys(tagColorMap).length % TAG_COLORS.length];
  }
  return tagColorMap[t];
}

function getAvatarColor(name) {
  if (!name) return ['#e2e8f0','#475569'];
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}

function setSyncStatus(s) {
  var el = document.getElementById('sync-status');
  if (s === 'busy') el.innerHTML = '<span class="sync-busy">Saving...</span>';
  else if (s === 'ok') el.innerHTML = '<span class="sync-ok">Saved</span>';
  else el.innerHTML = '';
}

function waitFB() {
  return new Promise(function(r) {
    var t = setInterval(function() { if (window._fb) { clearInterval(t); r(window._fb); } }, 50);
  });
}

async function load() {
  var mv = document.getElementById('main-view');
  mv.innerHTML = '<div class="loading" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:60px">'+
    '<svg width="52" height="32" viewBox="-2 0 32 22" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><linearGradient id="llg2" x1="0" y1="0" x2="28" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#64748B"/></linearGradient></defs>'+
      '<path d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z" fill="none" stroke="url(#llg2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30 90" stroke-dashoffset="0">'+
        '<animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.2s" repeatCount="indefinite"/>'+
      '</path>'+
    '</svg>'+
    '<span style="font-size:12px;font-weight:500;color:#94a3b8">Loading tasks...</span>'+
  '</div>';
  var fb = await waitFB();
  try {
    var raw = await fb.load();
    tasks = raw.map(function(r) {
      return {
        id: r.id, title: r.title || 'Untitled', desc: r.desc || '',
        status: r.status || 'todo', priority: r.priority || 'Medium',
        assignee: r.assignee || '', due: r.due || '',
        tags: r.tags || [], comments: r.comments || [], updated: r.updated || Date.now()
      };
    });
  } catch(e) {
    mv.innerHTML = '<div class="loading">Could not connect to Firebase.</div>';
    return;
  }
  initDropdowns();
  renderTracker();
  setSyncStatus('ok');
}

function switchTab(tab) {
  currentTab = tab;
  ['tracker','dashboard','archived'].forEach(function(id) {
    document.getElementById('tab-'+id).className = 'nav-tab' + (tab===id ? ' active' : '');
    document.getElementById('page-'+id).className = 'page' + (tab===id ? ' active' : '');
  });
  document.getElementById('nav-new-btn').style.display = tab === 'tracker' ? '' : 'none';
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'archived') renderArchived();
}

function setView(v) {
  view = v;
  document.getElementById('btn-kanban').className = v === 'kanban' ? 'active' : '';
  document.getElementById('btn-list').className = v === 'list' ? 'active' : '';
  renderTracker();
}

function initDropdowns() {
  buildDD('dd-status', STATUSES.map(function(s){return {id:s.id,label:s.label,dot:s.dot};}), '', 'All statuses', function(v){filters.status=v;renderTracker();});
  buildDD('dd-priority', PRIORITIES.map(function(p){return {id:p.id,label:p.id,dot:p.dot};}), '', 'All priorities', function(v){filters.priority=v;renderTracker();});
  updateAssigneeDD();
}

function updateAssigneeDD() {
  var names = [];
  tasks.forEach(function(t){ if(t.assignee && names.indexOf(t.assignee)===-1) names.push(t.assignee); });
  names.sort();
  buildDD('dd-assignee', names.map(function(n){return {id:n,label:n};}), filters.assignee, 'All assignees', function(v){filters.assignee=v;renderTracker();});
}

function isArchived(t) {
  return t.status === 'done' && t.updated && (Date.now() - t.updated) > 7 * 864e5;
}

function filtered() {
  var ql = ((document.getElementById('search') || {}).value || '').toLowerCase();
  return tasks.filter(function(t) {
    if (isArchived(t)) return false;
    if (ql && t.title.toLowerCase().indexOf(ql)===-1 && (t.desc||'').toLowerCase().indexOf(ql)===-1 && (t.tags||[]).join(' ').toLowerCase().indexOf(ql)===-1) return false;
    if (filters.status && t.status !== filters.status) return false;
    if (filters.priority && t.priority !== filters.priority) return false;
    if (filters.assignee && t.assignee !== filters.assignee) return false;
    return true;
  });
}

function renderTracker() { updateAssigneeDD(); view === 'kanban' ? renderKanban() : renderList(); }

function renderKanban() {
  var f = filtered();
  var mv = document.getElementById('main-view'); mv.innerHTML = '';
  var board = document.createElement('div'); board.className = 'kanban';
  var blockedCount = f.filter(function(t){return t.status==='blocked';}).length;
  var colCount = blockedCount ? 5 : 4;
  board.style.gridTemplateColumns = 'repeat('+colCount+',1fr)';
  STATUSES.forEach(function(s) {
    var cards = f.filter(function(t){return t.status===s.id;});
    // Collapse Blocked column when empty
    if (s.id === 'blocked' && !cards.length) return;
    var arch = s.id==='done' ? tasks.filter(isArchived).length : 0;
    var col = document.createElement('div'); col.className = 'col';
    var hdr = document.createElement('div'); hdr.className = 'col-header'; hdr.style.background = s.hdr;
    hdr.innerHTML = '<span class="col-title" style="color:'+s.color+'">'+s.label+'</span>'+
      '<div style="display:flex;align-items:center;gap:6px">'+
      (arch ? '<span style="font-size:10px;color:#94a3b8">'+arch+' archived</span>' : '')+
      '<span style="font-size:18px;font-weight:700;color:'+s.color+'">'+cards.length+'</span></div>';
    var body = document.createElement('div'); body.className = 'col-body';
    if (!cards.length) {
      var e = document.createElement('div'); e.style.cssText='text-align:center;color:#94a3b8;font-size:11px;padding:20px 0'; e.textContent='Drop tasks here'; body.appendChild(e);
    } else {
      cards.forEach(function(t){ body.appendChild(makeCard(t)); });
    }
    col.addEventListener('dragover', function(e){e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave', function(){col.classList.remove('drag-over');});
    col.addEventListener('drop', function(e) {
      e.preventDefault(); col.classList.remove('drag-over');
      var id = e.dataTransfer.getData('text');
      var t = tasks.filter(function(x){return x.id===id;})[0];
      if (t && t.status !== s.id) {
        t.status = s.id; t.updated = Date.now(); renderTracker();
        setSyncStatus('busy');
        waitFB().then(function(fb){ fb.update(id,{status:s.id,updated:t.updated}).then(function(){setSyncStatus('ok');}); });
      }
    });
    col.appendChild(hdr); col.appendChild(body); board.appendChild(col);
  });
  mv.appendChild(board);
}

function makeCard(t) {
  var overdue = t.due && new Date(t.due+'T00:00:00') < new Date() && t.status !== 'done';
  var initials = t.assignee ? t.assignee.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase() : '?';
  var ps = PSTYLE[t.priority] || {bg:'#f1f5f9',color:'#475569'};
  var ac = getAvatarColor(t.assignee);
  var card = document.createElement('div'); card.className = 'task-card'; card.draggable = true;

  // Title
  var ti = document.createElement('div'); ti.className = 'task-title'; ti.textContent = t.title; card.appendChild(ti);

  var ft = document.createElement('div');
  ft.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:nowrap';

  var avatarEl = document.createElement('span');
  avatarEl.className = 'avatar';
  avatarEl.style.cssText = 'width:24px;height:24px;font-size:9px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;background:'+ac[0]+';color:'+ac[1];
  avatarEl.textContent = initials;
  ft.appendChild(avatarEl);

  var nameEl = document.createElement('span');
  nameEl.style.cssText = 'font-size:13px;color:#334155;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:clip;flex:1;min-width:0';
  nameEl.textContent = t.assignee || 'Unassigned';
  ft.appendChild(nameEl);

  if (t.due) {
    var dueEl = document.createElement('span');
    dueEl.style.cssText = 'font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:3px;color:'+(overdue?'#dc2626':'#64748B');

function buildDD(cid, options, value, placeholder, onChange) {
  var wrap = document.createElement('div'); wrap.className = 'dd-wrap';
  var open = false; var val = value;
  function getLabel() { var o = options.filter(function(x){return x.id===val;})[0]; return o ? o.label : placeholder; }
  function closeDD() { if (!open) return; open = false; renderDD(); }
  function renderDD() {
    wrap.innerHTML = '';
    var tr = document.createElement('div'); tr.className = 'dd-trigger' + (open ? ' open' : '');
    tr.innerHTML = '<span>'+getLabel()+'</span><span class="dd-arrow"></span>';
    tr.onclick = function(e) {
      e.stopPropagation();
      if (!open && openDDClose && openDDClose !== closeDD) { openDDClose(); openDDClose = null; }
      open = !open; openDDClose = open ? closeDD : null; renderDD();
    };
    wrap.appendChild(tr);
    if (open) {
      var mn = document.createElement('div'); mn.className = 'dd-menu';
      var allOpts = cid === 'dd-status' || cid === 'dd-priority' || cid === 'dd-assignee'
        ? [{id:'',label:placeholder}].concat(options)
        : options;
      allOpts.forEach(function(o) {
        var it = document.createElement('div'); it.className = 'dd-option' + (val===o.id?' selected':'');
        it.innerHTML = (o.dot ? '<span class="dd-dot" style="background:'+o.dot+'"></span>' : '') + '<span>'+o.label+'</span>';
        it.onclick = function(e) { e.stopPropagation(); val=o.id; open=false; openDDClose=null; renderDD(); onChange(val); };
        mn.appendChild(it);
      });
      wrap.appendChild(mn);
    }
  }
  renderDD();
  var ct = document.getElementById(cid); if (ct) { ct.innerHTML=''; ct.appendChild(wrap); }
  return { setValue: function(v){ val=v; renderDD(); } };
}

function buildTagInput(cid, initialTags) {
  var allTags = [].concat(ALL_TAGS);
  tasks.forEach(function(t){ (t.tags||[]).forEach(function(tag){ if(allTags.indexOf(tag)===-1) allTags.push(tag); }); });
  allTags.sort();
  var chips = initialTags.slice(); var si = -1;
  var wrap = document.createElement('div'); wrap.className = 'tag-input-wrap';
  var inp = document.createElement('input'); inp.type='text'; inp.className='tag-text-input'; inp.placeholder=chips.length?'':'Add tags...';
  var sb = document.createElement('div'); sb.className='tag-suggestions'; sb.style.display='none';
  function rc() {
    wrap.querySelectorAll('.tag-chip-modal').forEach(function(c){c.remove();});
    chips.forEach(function(tag,i) {
      var cls=getTagColor(tag); var ch=document.createElement('span'); ch.className='tag-chip-modal '+cls;
      ch.innerHTML='#'+esc(tag)+'<button class="tag-chip-x">x</button>';
      ch.querySelector('.tag-chip-x').onclick=function(e){e.stopPropagation();chips.splice(i,1);rc();inp.placeholder=chips.length?'':'Add tags...';};
      wrap.insertBefore(ch,inp);
    });
  }
  function gs(q) {
    var used = chips.map(function(t){return t.toLowerCase();});
    return allTags.filter(function(t){return used.indexOf(t.toLowerCase())===-1 && t.toLowerCase().indexOf(q.toLowerCase())!==-1;});
  }
  function ss(q) {
    sb.innerHTML=''; si=-1; if(!q){sb.style.display='none';return;}
    var sg=gs(q); var items=[];
    sg.forEach(function(s){
      var it=document.createElement('div');it.className='tag-sugg-item';
      it.innerHTML='<span class="tag-chip-modal '+getTagColor(s)+'">#'+esc(s)+'</span><span>'+esc(s)+'</span>';
      it.onmousedown=function(e){e.preventDefault();at(s);};sb.appendChild(it);items.push(it);
    });
    if(chips.map(function(t){return t.toLowerCase();}).indexOf(q.toLowerCase())===-1 && q.trim()){
      var ni=document.createElement('div');ni.className='tag-sugg-item';
      ni.innerHTML='<span class="tag-chip-modal '+getTagColor(q.trim())+'">#'+esc(q.trim())+'</span><span class="tag-sugg-new">— create new</span>';
      ni.onmousedown=function(e){e.preventDefault();at(q.trim());};sb.appendChild(ni);items.push(ni);
    }
    sb.style.display=items.length?'block':'none';
  }
  function at(tag) {
    tag=tag.trim();
    if(!tag||chips.map(function(t){return t.toLowerCase();}).indexOf(tag.toLowerCase())!==-1) return;
    getTagColor(tag); chips.push(tag); inp.value=''; inp.placeholder=''; rc(); sb.style.display='none';
  }
  inp.oninput=function(){ss(inp.value);};
  inp.onkeydown=function(e){
    var its=[].slice.call(sb.querySelectorAll('.tag-sugg-item'));
    if(e.key==='ArrowDown'){e.preventDefault();si=Math.min(si+1,its.length-1);its.forEach(function(it,i){it.classList.toggle('actv',i===si);});}
    else if(e.key==='ArrowUp'){e.preventDefault();si=Math.max(si-1,0);its.forEach(function(it,i){it.classList.toggle('actv',i===si);});}
    else if(e.key==='Enter'){e.preventDefault();if(si>=0&&its[si])its[si].onmousedown(e);else if(inp.value.trim())at(inp.value);}
    else if(e.key==='Backspace'&&!inp.value&&chips.length){chips.pop();rc();inp.placeholder=chips.length?'':'Add tags...';}
    else if(e.key==='Escape')sb.style.display='none';
  };
  inp.onfocus=function(){wrap.classList.add('focused');};
  inp.onblur=function(){wrap.classList.remove('focused');setTimeout(function(){sb.style.display='none';},150);};
  wrap.onclick=function(){inp.focus();};
  wrap.appendChild(inp); wrap.appendChild(sb); rc();
  var ct=document.getElementById(cid); ct.innerHTML=''; ct.appendChild(wrap);
  return { getTags: function(){return chips;} };
}

function closeModal() { document.getElementById('modal-container').innerHTML=''; tagInputRef=null; }

async function saveTask(gd) {
  var title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Title is required.'); return; }
  var dd = gd(); var tags = tagInputRef ? tagInputRef.getTags() : [];
  var fields = {
    title: title,
    desc: document.getElementById('f-desc').value,
    status: dd.status, priority: dd.priority,
    assignee: document.getElementById('f-assignee').value,
    due: document.getElementById('f-due').value,
    tags: tags
  };
  closeModal(); setSyncStatus('busy');
  var fb = await waitFB();
  if (editId) {
    var t = tasks.filter(function(x){return x.id===editId;})[0];
    Object.assign(t, fields, {updated: Date.now()});
    await fb.update(editId, Object.assign({}, fields, {updated: Date.now()}));
  } else {
    var newT = Object.assign({}, fields, {comments:[], updated:Date.now()});
    var newId = await fb.add(newT);
    tasks.unshift(Object.assign({id:newId}, newT));
  }
  setSyncStatus('ok'); renderTracker(); updateAssigneeDD();
  if (currentTab === 'dashboard') renderDashboard();
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  closeModal(); setSyncStatus('busy');
  tasks = tasks.filter(function(x){return x.id!==id;});
  renderTracker();
  var fb = await waitFB(); await fb.remove(id); setSyncStatus('ok');
  if (currentTab === 'dashboard') renderDashboard();
}

async function addComment() {
  var inp = document.getElementById('f-comment'); var text = inp.value.trim(); if (!text) return;
  var t = tasks.filter(function(x){return x.id===editId;})[0]; if (!t) return;
  t.comments = t.comments || []; t.comments.push({text:text,ts:Date.now()}); t.updated = Date.now();
  setSyncStatus('busy');
  var fb = await waitFB(); await fb.update(editId,{comments:t.comments,updated:t.updated}); setSyncStatus('ok');
  openModal(editId);
}

async function restoreTask(id) {
  var t = tasks.filter(function(x){return x.id===id;})[0]; if (!t) return;
  t.status='todo'; t.updated=Date.now(); setSyncStatus('busy');
  var fb = await waitFB(); await fb.update(id,{status:'todo',updated:t.updated}); setSyncStatus('ok');
  renderArchived(); renderTracker();
}

function svgDonut(segs, sz) {
  var cx=sz/2, cy=sz/2, r=sz*0.36, sw=sz*0.28;
  var total=segs.reduce(function(a,b){return a+b.v;},0)||1;
  var a=-Math.PI/2;
  var arcs=segs.filter(function(s){return s.v>0;}).map(function(s){
    var sweep=(s.v/total)*2*Math.PI*0.9999;
    var x1=+(cx+r*Math.cos(a)).toFixed(3), y1=+(cy+r*Math.sin(a)).toFixed(3);
    a+=sweep;
    var x2=+(cx+r*Math.cos(a)).toFixed(3), y2=+(cy+r*Math.sin(a)).toFixed(3);
    return '<path d="M'+x1+' '+y1+' A '+r+' '+r+' 0 '+(sweep>Math.PI?1:0)+' 1 '+x2+' '+y2+'" fill="none" stroke="'+s.c+'" stroke-width="'+sw+'" stroke-linecap="butt"/>';
  }).join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" style="display:block;overflow:visible">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#e2e8f0" stroke-width="'+sw+'"/>'+arcs+'</svg>';
}

function donutCard(title, segs) {
  var total=segs.reduce(function(a,b){return a+b.v;},0)||1;
  var c=dc('');
  c.innerHTML=title+'<div class="donut-row"><div class="donut-ph"></div><div class="d-legend">'+
    '<div class="d-legend-total">Total: '+total+'</div>'+
    segs.map(function(s){return '<div class="d-leg-row"><span class="d-leg-sq" style="background:'+s.c+'"></span><span class="d-leg-lbl">'+esc(s.l)+'</span><span class="d-leg-val" style="color:'+s.c+'">'+s.v+'</span></div>';}).join('')+
  '</div></div>';
  requestAnimationFrame(function(){
    var row=c.querySelector('.donut-row'), leg=c.querySelector('.d-legend');
    if(!row||!leg)return;
    var sz=Math.max(140,Math.min(c.clientWidth-32-leg.offsetWidth-20,340));
    var ph=row.querySelector('.donut-ph'); if(ph)ph.outerHTML=svgDonut(segs,sz);
  });
  return c;
}

  var segs=names.map(function(n,i){return {c:AVATAR_PALETTE[i%AVATAR_PALETTE.length][1],v:tasks.filter(function(t){return t.assignee===n;}).length,l:n};});
  if(!names.length){var c=dc('');c.innerHTML=dct('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>','By Assignee')+'<div class="empty">No assignees yet</div>';return c;}
  return donutCard(dct('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>','By Assignee'),segs);
}

function wPriority() {
  var c=dc('');
  c.innerHTML=dct('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>','Tasks by Priority')+
    '<div class="p-list">'+PORDER.map(function(p){return '<div class="p-row"><span class="p-dot" style="background:'+PCOLORS[p]+'"></span><span class="p-lbl">'+p+'</span><span class="p-val" style="color:'+PCOLORS[p]+'">'+tasks.filter(function(t){return t.priority===p;}).length+'</span></div>';}).join('')+'</div>';
  return c;
}

function liRow(t, dotColor, rightHTML) {
  return '<div class="li"><div class="li-dot" style="background:'+dotColor+'"></div><div class="li-main"><div class="li-title">'+esc(t.title)+'</div><div class="li-meta">'+esc(t.assignee||'—')+' · <span class="dpill dp-'+t.priority+'">'+t.priority+'</span></div></div><div class="li-right">'+rightHTML+'</div></div>';
}

function wOverdue() {
  var c=dc(''); var now=new Date(); now.setHours(0,0,0,0);
  var ov=tasks.filter(function(t){return t.due&&new Date(t.due+'T00:00:00')<now&&t.status!=='done';}).sort(function(a,b){return new Date(a.due)-new Date(b.due);});
  c.innerHTML=dct('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>','Overdue <span style="margin-left:4px;background:#fee2e2;color:#991b1b;font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700">'+ov.length+'</span>')+
    (ov.length ? ov.map(function(t){var days=Math.round((now-new Date(t.due+'T00:00:00'))/(864e5));return liRow(t,PCOLORS[t.priority],'<div class="li-due">'+fmtDate(t.due)+'</div><div class="li-days">'+days+'d ago</div>');}).join('') : '<div class="empty">No overdue tasks!</div>');
  return c;
}

function wUpcoming() {
  var c=dc(''); var now=new Date(); now.setHours(0,0,0,0);
  var soon=new Date(now); soon.setDate(soon.getDate()+7);
  var up=tasks.filter(function(t){if(!t.due||t.status==='done')return false;var d=new Date(t.due+'T00:00:00');return d>=now&&d<=soon;}).sort(function(a,b){return new Date(a.due)-new Date(b.due);});
  c.innerHTML=dct('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>','Upcoming (7 days)')+
    (up.length ? up.map(function(t){var d=new Date(t.due+'T00:00:00'),days=Math.round((d-now)/864e5),lbl=days===0?'Today':days===1?'Tomorrow':'In '+days+'d';var sc=(STATUSES.filter(function(x){return x.id===t.status;})[0]||{color:'#94a3b8'}).color;return liRow(t,sc,'<div class="li-due" style="color:'+(days===0?'#dc2626':'#d97706')+'">'+fmtDate(t.due)+'</div><div class="li-days">'+lbl+'</div>');}).join('') : '<div class="empty">No tasks due in 7 days</div>');
  return c;
}

function wTimeline() {
  var c=dc('full');
  var ev=[].concat(tasks).sort(function(a,b){return (b.updated||0)-(a.updated||0);});
  c.innerHTML=dct('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>','Activity Timeline')+
    '<div class="tl-grid">'+ev.slice(0,10).map(function(e){
      var st=STATUSES.filter(function(x){return x.id===e.status;})[0];
      var bg=st?st.color+'22':'#f1f5f9';
      return '<div class="tl-item"><div class="tl-icon" style="background:'+bg+'">✏</div><div class="tl-body"><div class="tl-text"><strong>'+esc(e.title)+'</strong><span style="color:#94a3b8"> · '+(st?st.label:e.status)+'</span></div><div class="tl-time">'+timeAgo(e.updated||Date.now())+'</div></div></div>';
    }).join('')+'</div>';
  return c;
}

function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function timeAgo(ts){var s=Math.round((Date.now()-ts)/1000);if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(document.querySelector('.modal-bg')){closeModal();return;}
  if(openDDClose){openDDClose();openDDClose=null;}
  document.querySelectorAll('.tag-suggestions').forEach(function(s){s.style.display='none';});
});

// App load is triggered by onAuthStateChanged once user is signed in
window._appLoad = load;
</script>
</body>
</html>
