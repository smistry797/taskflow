<meta name="description" content="TaskFlow — Streamlined Workflow Management">
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyD8R-lhnnaebAfk7NT84Jvv706UvKBILvE",
  authDomain:"taskflow-af878.firebaseapp.com",
  projectId:"taskflow-af878",
  storageBucket:"taskflow-af878.firebasestorage.app",
  messagingSenderId:"287459262722",
  appId:"1:287459262722:web:184b71f4e705a607c2821b"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const COL='tasks';

window._fb={
  async load(){
    const q=query(collection(db,COL),orderBy('createdAt','desc'));
    const snap=await getDocs(q);
    return snap.docs.map(d=>({id:d.id,...d.data(),updated:d.data().updatedAt?.toMillis?.()||Date.now()}));
  },
  async add(fields){
    const ref=await addDoc(collection(db,COL),{...fields,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
    return ref.id;
  },
  async update(id,fields){
    await updateDoc(doc(db,COL,id),{...fields,updatedAt:serverTimestamp()});
  },
  async remove(id){
    await deleteDoc(doc(db,COL,id));
  }
};
</script>
<style>

</style>

<body>
<div class="app">
  <div class="nav">
    <div class="nav-left">
      <div class="nav-brand">
        <svg width="36" height="20" viewBox="-2 0 32 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cg1" x1="0" y1="0" x2="28" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1E293B"/>
              <stop offset="100%" stop-color="#64748B"/>
            </linearGradient>
          </defs>
          <path d="M14 11 C14 11 9 3 5 3 C1 3 -1 7 -1 11 C-1 15 1 19 5 19 C9 19 14 11 14 11 C14 11 19 3 23 3 C27 3 29 7 29 11 C29 15 27 19 23 19 C19 19 14 11 14 11 Z"

<script>
const STATUSES=[
  {id:'todo',label:'To Do',color:'#aaa',tcls:'s-todo',hdr:'#dedad3',dot:'#aaa'},
  {id:'inprogress',label:'In Progress',color:'#378ADD',tcls:'s-inprogress',hdr:'#cfe0f7',dot:'#378ADD'},
  {id:'waiting',label:'Waiting',color:'#EF9F27',tcls:'s-waiting',hdr:'#fde8b0',dot:'#EF9F27'},
  {id:'done',label:'Done',color:'#639922',tcls:'s-done',hdr:'#c9f0d8',dot:'#639922'},
  {id:'blocked',label:'Blocked',color:'#E24B4A',tcls:'s-blocked',hdr:'#fdd5d5',dot:'#E24B4A'}
];
const PRIORITIES=[{id:'Critical',dot:'#E24B4A'},{id:'High',dot:'#EF9F27'},{id:'Medium',dot:'#378ADD'},{id:'Low',dot:'#639922'}];
const PSTYLE={Critical:{bg:'#fee2e2',color:'#7f1d1d'},High:{bg:'#fef3c7',color:'#78350f'},Medium:{bg:'#dbeafe',color:'#1e3a5f'},Low:{bg:'#dcfce7',color:'#14532d'}};
const PCOLORS={Critical:'#E24B4A',High:'#EF9F27',Medium:'#378ADD',Low:'#639922'};
const PORDER=['Critical','High','Medium','Low'];
const TAG_COLORS=['tc4','tc5','tc6','tc7','tc8','tc9','tc10','tc11'];
const ACOLORS=[['#dbeafe','#1e3a5f'],['#dcfce7','#14532d'],['#fef3c7','#78350f'],['#f3e8ff','#581c87'],['#fce7f3','#831843']];
const ALL_TAGS=['DevOps','QA','Bug','Docs','Client','HR','Autoweave','SLA'];
let tagColorMap={},tasks=[],view='kanban',editId=null,currentTab='tracker';
let filters={status:'',priority:'',assignee:''};

function getTagColor(t){
  if(!tagColorMap[t]){const used=Object.values(tagColorMap);tagColorMap[t]=TAG_COLORS.find(c=>!used.includes(c))||TAG_COLORS[Object.keys(tagColorMap).length%TAG_COLORS.length];}
  return tagColorMap[t];
}

function setSyncStatus(s){
  const el=document.getElementById('sync-status');
  if(s==='busy')el.innerHTML='<span class="sync-busy">⟳ Saving…</span>';
  else if(s==='ok')el.innerHTML='<span class="sync-ok">✓ Saved</span>';
  else el.innerHTML='';
}

/* ── FIREBASE BRIDGE (waits for module to load) ── */
function waitFB(){
  return new Promise(res=>{
    const t=setInterval(()=>{if(window._fb){clearInterval(t);res(window._fb);}},50);
  });
}

/* ── LOAD ── */
async function load(){
  const mv=document.getElementById('main-view');
  mv.innerHTML='<div class="loading">Loading tasks…</div>';
  const fb=await waitFB();
  try{
    const raw=await fb.load();
    tasks=raw.map(r=>({
      id:r.id,
      title:r.title||'Untitled',
      desc:r.desc||'',
      status:r.status||'todo',
      priority:r.priority||'Medium',
      assignee:r.assignee||'',
      due:r.due||'',
      tags:r.tags||[],
      comments:r.comments||[],
      updated:r.updated||Date.now()
    }));
    // seed default tasks if empty
    if(!tasks.length){
      const defaults=[
        {title:'Autoweave : Review Stories',status:'todo',priority:'High',assignee:'Sanket Mistry',due:'2026-06-01',tags:['Autoweave'],desc:'',comments:[{text:'Review User Stories',ts:Date.now()}]},
        {title:'Maintenance SLA to SC',status:'todo',priority:'Medium',assignee:'Uma Tripathi',due:'2026-06-15',tags:['SLA'],desc:"We'll communicate the Maintenance SLA post payment clearance.",comments:[{text:'Call scheduled @6PM today',ts:Date.now()},{text:'Write to SC with Maintenance SLA',ts:Date.now()}]},
        {title:'Jigarbhai to get the sample test cases from Product team',status:'waiting',priority:'High',assignee:'Jigar Shah',due:'2026-05-26',tags:['QA'],desc:'Cygnature / HRinnova',comments:[]}
      ];
      for(const d of defaults){
        const id=await fb.add({...d,updated:Date.now()});
        tasks.push({id,...d,updated:Date.now()});
      }
    }
  }catch(e){
    mv.innerHTML='<div class="loading">⚠ Could not connect to Firebase. Check your config.</div>';
    console.error(e);return;
  }
  initDropdowns();renderTracker();setSyncStatus('ok');
}

  currentTab=tab;
  ['tracker','dashboard'].forEach(id=>{
    document.getElementById('tab-'+id).className='nav-tab'+(tab===id?' active':'');
    document.getElementById('page-'+id).className='page'+(tab===id?' active':'');

/* ── TRACKER ── */
function setView(v){view=v;document.getElementById('btn-kanban').className=v==='kanban'?'active':'';document.getElementById('btn-list').className=v==='list'?'active':'';renderTracker();}
function initDropdowns(){
  buildDD('dd-status',STATUSES.map(s=>({id:s.id,label:s.label,dot:s.dot})),'','All statuses',v=>{filters.status=v;renderTracker();});
  buildDD('dd-priority',PRIORITIES.map(p=>({id:p.id,label:p.id,dot:p.dot})),'','All priorities',v=>{filters.priority=v;renderTracker();});
  updateAssigneeDD();
}
function updateAssigneeDD(){
  const names=[...new Set(tasks.map(t=>t.assignee).filter(Boolean))].sort();
  buildDD('dd-assignee',names.map(n=>({id:n,label:n})),filters.assignee,'All assignees',v=>{filters.assignee=v;renderTracker();});
}
function isArchived(t){return t.status==='done'&&t.updated&&(Date.now()-t.updated)>7*864e5;}
function filtered(){
  const ql=((document.getElementById('search')||{}).value||'').toLowerCase();
  return tasks.filter(t=>{
    if(isArchived(t))return false;
    if(ql&&!t.title.toLowerCase().includes(ql)&&!((t.desc||'').toLowerCase().includes(ql))&&!(t.tags||[]).join(' ').toLowerCase().includes(ql))return false;
    if(filters.status&&t.status!==filters.status)return false;
    if(filters.priority&&t.priority!==filters.priority)return false;
    if(filters.assignee&&t.assignee!==filters.assignee)return false;
    return true;
  });
}
function renderTracker(){updateAssigneeDD();view==='kanban'?renderKanban():renderList();}

function renderKanban(){
  const f=filtered(),mv=document.getElementById('main-view');mv.innerHTML='';
  const board=document.createElement('div');board.className='kanban';
  STATUSES.forEach(s=>{
    const cards=f.filter(t=>t.status===s.id);
    const arch=s.id==='done'?tasks.filter(isArchived).length:0;
    const col=document.createElement('div');col.className='col';
    const hdr=document.createElement('div');hdr.className='col-header';hdr.style.background=s.hdr;
    hdr.innerHTML='<span class="col-title" style="color:'+s.color+'">'+s.label+'</span>'+
      '<div style="display:flex;align-items:center;gap:6px">'+
      (arch?'<span style="font-size:10px;color:#aaa">'+arch+' archived</span>':'')+
      '<span style="font-size:18px;font-weight:700;color:'+s.color+'">'+cards.length+'</span></div>';
    const body=document.createElement('div');body.className='col-body';
    if(!cards.length){const e=document.createElement('div');e.style.cssText='text-align:center;color:#bbb;font-size:11px;padding:20px 0';e.textContent='Drop tasks here';body.appendChild(e);}
    else cards.forEach(t=>body.appendChild(makeCard(t)));
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text');
      const t=tasks.find(x=>x.id===id);
      if(t&&t.status!==s.id){
        t.status=s.id;t.updated=Date.now();
        renderTracker();
        setSyncStatus('busy');
        const fb=await waitFB();
        await fb.update(id,{status:s.id,updated:t.updated});
        setSyncStatus('ok');
        if(currentTab==='dashboard')renderDashboard();
      }
    });
    col.appendChild(hdr);col.appendChild(body);board.appendChild(col);
  });
  mv.appendChild(board);
}

function makeCard(t){
  const overdue=t.due&&new Date(t.due+'T00:00:00')<new Date()&&t.status!=='done';
  const initials=t.assignee?t.assignee.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase():'?';
  const ps=PSTYLE[t.priority]||{bg:'#f0ede8',color:'#555'};
  const card=document.createElement('div');card.className='task-card';card.draggable=true;
  const ti=document.createElement('div');ti.className='task-title';ti.textContent=t.title;card.appendChild(ti);
  const ft=document.createElement('div');ft.className='task-footer';
  const av=document.createElement('span');av.className='assignee';av.innerHTML='<span class="avatar">'+initials+'</span><span>'+esc(t.assignee||'Unassigned')+'</span>';
  const rt=document.createElement('div');rt.style.cssText='display:flex;align-items:center;gap:5px';
  if(t.due){const de=document.createElement('span');de.className='due'+(overdue?' overdue':'');de.textContent=(overdue?'⚠ ':'')+fmtDate(t.due);rt.appendChild(de);}
  const pe=document.createElement('span');pe.className='priority-pill';pe.style.background=ps.bg;pe.style.color=ps.color;pe.textContent=t.priority;rt.appendChild(pe);
  ft.appendChild(av);ft.appendChild(rt);card.appendChild(ft);
  if((t.tags||[]).length){
    const tg=document.createElement('div');tg.className='task-tags';
    t.tags.slice(0,3).forEach(tag=>{const ch=document.createElement('span');ch.className='tag-chip '+getTagColor(tag);ch.textContent='#'+tag;tg.appendChild(ch);});
    card.appendChild(tg);
  }
  card.addEventListener('dragstart',e=>e.dataTransfer.setData('text',t.id));
  card.addEventListener('click',()=>openModal(t.id));
  return card;
}

  const f=filtered(),mv=document.getElementById('main-view');

/* ── DROPDOWN ── */
function buildDD(cid,options,value,placeholder,onChange){
  const wrap=document.createElement('div');wrap.className='dd-wrap';
  let open=false,val=value;
  function gl(){const o=options.find(x=>x.id===val);return o?o.label:placeholder;}
  function rr(){
    wrap.innerHTML='';
    const tr=document.createElement('div');tr.className='dd-trigger'+(open?' open':'');
    tr.innerHTML='<span>'+gl()+'</span><span class="dd-arrow"></span>';
    tr.onclick=e=>{e.stopPropagation();open=!open;rr();};
    wrap.appendChild(tr);
    if(open){
      const mn=document.createElement('div');mn.className='dd-menu';
      [{id:'',label:placeholder,dot:'#ddd'},...options].forEach(o=>{
        const it=document.createElement('div');it.className='dd-option'+(val===o.id?' selected':'');
        it.innerHTML=(o.dot?'<span class="dot" style="background:'+o.dot+'"></span>':'')+'<span>'+o.label+'</span>';
        it.onclick=e=>{e.stopPropagation();val=o.id;open=false;rr();onChange(val);};
        mn.appendChild(it);
      });
      wrap.appendChild(mn);
    }
  }
  rr();
  document.addEventListener('click',()=>{if(open){open=false;rr();}});
  const ct=document.getElementById(cid);if(ct){ct.innerHTML='';ct.appendChild(wrap);}
}

/* ── TAG INPUT ── */
function buildTagInput(cid,initialTags){
  const allTags=[...new Set([...ALL_TAGS,...tasks.flatMap(t=>t.tags||[])])].sort();
  let chips=[...initialTags],si=-1;
  const wrap=document.createElement('div');wrap.className='tag-input-wrap';
  const inp=document.createElement('input');inp.type='text';inp.className='tag-text-input';inp.placeholder=chips.length?'':'Add tags…';
  const sb=document.createElement('div');sb.className='tag-suggestions';sb.style.display='none';
  function rc(){
    wrap.querySelectorAll('.tag-chip-modal').forEach(c=>c.remove());
    chips.forEach((tag,i)=>{
      const cls=getTagColor(tag),ch=document.createElement('span');ch.className='tag-chip-modal '+cls;
      ch.innerHTML='#'+esc(tag)+'<button class="tag-chip-x">×</button>';
      ch.querySelector('.tag-chip-x').onclick=e=>{e.stopPropagation();chips.splice(i,1);rc();inp.placeholder=chips.length?'':'Add tags…';};
      wrap.insertBefore(ch,inp);
    });
  }
  function gs(q){const used=new Set(chips.map(t=>t.toLowerCase()));return allTags.filter(t=>!used.has(t.toLowerCase())&&t.toLowerCase().includes(q.toLowerCase()));}
  function ss(q){
    sb.innerHTML='';si=-1;if(!q){sb.style.display='none';return;}
    const sg=gs(q),items=[];
    sg.forEach(s=>{const it=document.createElement('div');it.className='tag-sugg-item';it.innerHTML='<span class="tag-chip-modal '+getTagColor(s)+'">#'+esc(s)+'</span><span>'+esc(s)+'</span>';it.onmousedown=e=>{e.preventDefault();at(s);};sb.appendChild(it);items.push(it);});
    if(!chips.map(t=>t.toLowerCase()).includes(q.toLowerCase())&&q.trim()){const ni=document.createElement('div');ni.className='tag-sugg-item';ni.innerHTML='<span class="tag-chip-modal '+getTagColor(q.trim())+'">#'+esc(q.trim())+'</span><span class="tag-sugg-new">— create new</span>';ni.onmousedown=e=>{e.preventDefault();at(q.trim());};sb.appendChild(ni);items.push(ni);}
    sb.style.display=items.length?'block':'none';
  }
  function at(tag){tag=tag.trim();if(!tag||chips.map(t=>t.toLowerCase()).includes(tag.toLowerCase()))return;getTagColor(tag);chips.push(tag);inp.value='';inp.placeholder='';rc();sb.style.display='none';}
  inp.oninput=()=>ss(inp.value);
  inp.onkeydown=e=>{
    const its=[...sb.querySelectorAll('.tag-sugg-item')];
    if(e.key==='ArrowDown'){e.preventDefault();si=Math.min(si+1,its.length-1);its.forEach((it,i)=>it.classList.toggle('actv',i===si));}
    else if(e.key==='ArrowUp'){e.preventDefault();si=Math.max(si-1,0);its.forEach((it,i)=>it.classList.toggle('actv',i===si));}
    else if(e.key==='Enter'){e.preventDefault();if(si>=0&&its[si])its[si].onmousedown(e);else if(inp.value.trim())at(inp.value);}
    else if(e.key==='Backspace'&&!inp.value&&chips.length){chips.pop();rc();inp.placeholder=chips.length?'':'Add tags…';}
    else if(e.key==='Escape')sb.style.display='none';
  };
  inp.onfocus=()=>wrap.classList.add('focused');
  inp.onblur=()=>{wrap.classList.remove('focused');setTimeout(()=>sb.style.display='none',150);};
  wrap.onclick=()=>inp.focus();
  wrap.appendChild(inp);wrap.appendChild(sb);rc();
  const ct=document.getElementById(cid);ct.innerHTML='';ct.appendChild(wrap);
  return{getTags:()=>chips};
}

function openModal(id){

      '<div class="comment-input-row"><input type="text" id="f-comment" placeholder="Add a comment…"><button class="btn primary" id="btn-comment">Send</button></div></div>'
    :'');
  const mf=document.createElement('div');mf.className='modal-footer-bar';
  mf.innerHTML=(t?'<button class="btn danger" id="btn-delete">🗑 Delete</button>':'')+'<button class="btn" id="btn-cancel">Cancel</button><button class="btn primary" id="btn-save">✓ Save</button>';
  modal.appendChild(mh);modal.appendChild(mb);modal.appendChild(mf);bg.appendChild(modal);
  document.getElementById('modal-container').innerHTML='';document.getElementById('modal-container').appendChild(bg);
  let mS=t?t.status:'todo',mP=t?t.priority:'Medium';
  buildDD('m-status',STATUSES.map(s=>({id:s.id,label:s.label,dot:s.dot})),mS,'Status',v=>mS=v);
  buildDD('m-priority',PRIORITIES.map(p=>({id:p.id,label:p.id,dot:p.dot})),mP,'Priority',v=>mP=v);
  tagInputRef=buildTagInput('tag-input-container',t?t.tags||[]:[]);
  mf.querySelector('#btn-cancel').onclick=closeModal;
  mf.querySelector('#btn-save').onclick=()=>saveTask(()=>({status:mS,priority:mP}));
  if(t){
    mf.querySelector('#btn-delete').onclick=()=>deleteTask(t.id);
    mb.querySelector('#btn-comment').onclick=addComment;
  }
}
function closeModal(){document.getElementById('modal-container').innerHTML='';tagInputRef=null;}

async function saveTask(gd){
  const title=document.getElementById('f-title').value.trim();if(!title){alert('Title is required.');return;}
  const dd=gd(),tags=tagInputRef?tagInputRef.getTags():[];
  const fields={title,desc:document.getElementById('f-desc').value,status:dd.status,priority:dd.priority,assignee:document.getElementById('f-assignee').value,due:document.getElementById('f-due').value,tags};
  closeModal();setSyncStatus('busy');
  const fb=await waitFB();
  if(editId){
    const t=tasks.find(x=>x.id===editId);
    Object.assign(t,fields,{updated:Date.now()});
    await fb.update(editId,{...fields,updated:Date.now()});
  } else {
    const newTask={...fields,comments:[],updated:Date.now()};
    const id=await fb.add(newTask);
    tasks.unshift({id,...newTask});
  }
  setSyncStatus('ok');renderTracker();updateAssigneeDD();
  if(currentTab==='dashboard')renderDashboard();
}

async function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  closeModal();setSyncStatus('busy');
  tasks=tasks.filter(x=>x.id!==id);
  renderTracker();
  const fb=await waitFB();
  await fb.remove(id);
  setSyncStatus('ok');
  if(currentTab==='dashboard')renderDashboard();
}

async function addComment(){
  const inp=document.getElementById('f-comment'),text=inp.value.trim();if(!text)return;
  const t=tasks.find(x=>x.id===editId);if(!t)return;
  t.comments=t.comments||[];
  t.comments.push({text,ts:Date.now()});
  t.updated=Date.now();
  setSyncStatus('busy');
  const fb=await waitFB();
  await fb.update(editId,{comments:t.comments,updated:t.updated});
  setSyncStatus('ok');
  openModal(editId);
}

function dc(full){const d=document.createElement('div');d.className='dc'+(full?' full':'');return d;}
function dctitle(icon,text){return '<div class="dc-title">'+icon+text+'</div>';}

function svgDonut(segs,sz){
  const cx=sz/2,cy=sz/2,r=sz*0.36,sw=sz*0.28;
  const total=segs.reduce((a,b)=>a+b.v,0)||1;
  let a=-Math.PI/2;
  const arcs=segs.filter(s=>s.v>0).map(s=>{
    const sweep=(s.v/total)*2*Math.PI*0.9999;
    const x1=+(cx+r*Math.cos(a)).toFixed(3),y1=+(cy+r*Math.sin(a)).toFixed(3);
    a+=sweep;const x2=+(cx+r*Math.cos(a)).toFixed(3),y2=+(cy+r*Math.sin(a)).toFixed(3);
    return '<path d="M'+x1+' '+y1+' A '+r+' '+r+' 0 '+(sweep>Math.PI?1:0)+' 1 '+x2+' '+y2+'" fill="none" stroke="'+s.c+'" stroke-width="'+sw+'" stroke-linecap="butt"/>';
  }).join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" style="display:block;overflow:visible">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#ece8e2" stroke-width="'+sw+'"/>'+arcs+'</svg>';
}

function donutCard(title,segs){
  const total=segs.reduce((a,b)=>a+b.v,0)||1;
  const c=dc('');
  c.innerHTML=title+'<div class="donut-row"><div class="donut-ph"></div><div class="d-legend">'+
    '<div class="d-legend-total">Total: '+total+'</div>'+
    segs.map(s=>'<div class="d-leg-row"><span class="d-leg-sq" style="background:'+s.c+'"></span><span class="d-leg-lbl">'+esc(s.l)+'</span><span class="d-leg-val" style="color:'+s.c+'">'+s.v+'</span></div>').join('')+
  '</div></div>';
  requestAnimationFrame(()=>{
    const row=c.querySelector('.donut-row'),leg=c.querySelector('.d-legend');
    if(!row||!leg)return;
    const sz=Math.max(140,Math.min(c.clientWidth-32-leg.offsetWidth-20,340));
    const ph=row.querySelector('.donut-ph');
    if(ph)ph.outerHTML=svgDonut(segs,sz);
  });
  return c;
}

function wOverview(){
  const c=dc('full');
  const total=tasks.length,done=tasks.filter(t=>t.status==='done').length,
    inp=tasks.filter(t=>t.status==='inprogress').length,
    ov=tasks.filter(t=>t.due&&new Date(t.due+'T00:00:00')<new Date()&&t.status!=='done').length;
  c.innerHTML=dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>','Overview')+
    '<div class="ov-grid">'+
    '<div class="ov-cell"><div class="ov-lbl">Total</div><div class="ov-val" style="color:#1a1a1a">'+total+'</div></div>'+
    '<div class="ov-cell"><div class="ov-lbl">Completed</div><div class="ov-val" style="color:#639922">'+done+'</div></div>'+
    '<div class="ov-cell"><div class="ov-lbl">In Progress</div><div class="ov-val" style="color:#378ADD">'+inp+'</div></div>'+
    '<div class="ov-cell"><div class="ov-lbl">Overdue</div><div class="ov-val" style="color:#E24B4A">'+ov+'</div></div>'+
    '</div>';
  return c;
}

function wStatus(){
  return donutCard(dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>','Tasks by Status'),
    STATUSES.map((s,i)=>({c:s.color,v:tasks.filter(t=>t.status===s.id).length,l:s.label})));
}

function wAssignee(){
  const names=[...new Set(tasks.map(t=>t.assignee).filter(Boolean))].sort();
  const ac=ACOLORS.map(a=>a[1]);
  const segs=names.map((n,i)=>({c:ac[i%ac.length],v:tasks.filter(t=>t.assignee===n).length,l:n}));
  if(!names.length){const c=dc('');c.innerHTML=dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>','By Assignee')+'<div class="empty">No assignees yet</div>';return c;}
  return donutCard(dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>','By Assignee'),segs);
}

function wPriority(){
  const c=dc('');
  const counts=PORDER.map(p=>tasks.filter(t=>t.priority===p).length);
  c.innerHTML=dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>','Tasks by Priority')+
    '<div class="p-list">'+PORDER.map((p,i)=>'<div class="p-row"><span class="p-dot" style="background:'+PCOLORS[p]+'"></span><span class="p-lbl">'+p+'</span><span class="p-val" style="color:'+PCOLORS[p]+'">'+counts[i]+'</span></div>').join('')+'</div>';
  return c;
}

function liRow(t,dotColor,rightHTML){
  return '<div class="li"><div class="li-dot" style="background:'+dotColor+'"></div><div class="li-main"><div class="li-title">'+esc(t.title)+'</div><div class="li-meta">'+esc(t.assignee||'—')+' · <span class="dpill dp-'+t.priority+'">'+t.priority+'</span></div></div><div class="li-right">'+rightHTML+'</div></div>';
}

function wOverdue(){
  const c=dc('');const now=new Date();now.setHours(0,0,0,0);
  const ov=tasks.filter(t=>t.due&&new Date(t.due+'T00:00:00')<now&&t.status!=='done').sort((a,b)=>new Date(a.due)-new Date(b.due));
  c.innerHTML=dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E24B4A" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>','Overdue <span style="margin-left:4px;background:#fee2e2;color:#7f1d1d;font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700">'+ov.length+'</span>')+
    (ov.length?ov.map(t=>{const days=Math.round((now-new Date(t.due+'T00:00:00'))/(864e5));return liRow(t,PCOLORS[t.priority],'<div class="li-due">'+fmtDate(t.due)+'</div><div class="li-days">'+days+'d ago</div>');}).join(''):'<div class="empty">🎉 No overdue tasks!</div>');
  return c;
}

function wUpcoming(){
  const c=dc('');const now=new Date();now.setHours(0,0,0,0);
  const soon=new Date(now);soon.setDate(soon.getDate()+7);
  const up=tasks.filter(t=>{if(!t.due||t.status==='done')return false;const d=new Date(t.due+'T00:00:00');return d>=now&&d<=soon;}).sort((a,b)=>new Date(a.due)-new Date(b.due));
  c.innerHTML=dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>','Upcoming (7 days)')+
    (up.length?up.map(t=>{const d=new Date(t.due+'T00:00:00'),days=Math.round((d-now)/864e5),lbl=days===0?'Today':days===1?'Tomorrow':'In '+days+'d';const sc=(STATUSES.find(x=>x.id===t.status)||{color:'#aaa'}).color;return liRow(t,sc,'<div class="li-due" style="color:'+(days===0?'#991f1f':'#78350f')+'">'+fmtDate(t.due)+'</div><div class="li-days">'+lbl+'</div>');}).join(''):'<div class="empty">No tasks due in 7 days</div>');
  return c;
}

function wTimeline(){
  const c=dc('full');
  const ev=[...tasks].sort((a,b)=>(b.updated||0)-(a.updated||0));
  c.innerHTML=dctitle('<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>','Activity Timeline')+
    '<div class="tl-grid">'+ev.slice(0,10).map(e=>{const st=STATUSES.find(x=>x.id===e.status);const bg=st?st.color+'22':'#f0ede8';
      return '<div class="tl-item"><div class="tl-icon" style="background:'+bg+'">✏️</div><div class="tl-body"><div class="tl-text"><strong>'+esc(e.title)+'</strong><span style="color:#888"> · '+(st?st.label:e.status)+'</span></div><div class="tl-time">'+timeAgo(e.updated||Date.now())+'</div></div></div>';
    }).join('')+'</div>';
  return c;
}

function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function timeAgo(ts){const s=Math.round((Date.now()-ts)/1000);if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.querySelector('.modal-bg')){closeModal();return;}
  document.querySelectorAll('.dd-trigger.open').forEach(t=>t.click());
  document.querySelectorAll('.tag-suggestions').forEach(s=>s.style.display='none');
});

load();
</script>
</body>
</html>
